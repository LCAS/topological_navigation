services:
  vnc:
    image: lcas.lincoln.ac.uk/vnc
    volumes:
      - x11:/tmp/.X11-unix
    # devices:
    #   - /dev/dri:/dev/dri
    networks:
      - ros_net
    shm_size: '2gb'
    stdin_open: true
    tty: true

  topo-nav:
    build:
      context: ../
      dockerfile: .devcontainer/Dockerfile
      target: devcontainer
    volumes:
      - x11:/tmp/.X11-unix
      - ../:/workspace/src:cached
    stdin_open: true
    tty: true
    networks:
      - ros_net
    depends_on: 
      - vnc
    environment:
      - DISPLAY=:1.0
      - ROS_DOMAIN_ID=10

volumes:
  x11:

networks:
  ros_net: