name: ros CI

on:
  push:
    branches: [ humble, main ]
    tags:     # Also run CI on tags.
      - '*'
  pull_request:

jobs:
  # -------------------------------------------------------------------
  # Lightweight unit tests (no ROS runtime needed)
  # -------------------------------------------------------------------
  unit_tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml jsonschema networkx scipy numpy Pillow pyproj

      - name: Run topological_navigation unit tests
        working-directory: topological_navigation
        run: |
          python -m pytest test/ \
            --ignore=test/test_navigationcore.py \
            --ignore=test/test_localisation2.py \
            --ignore=test/test_navigation2.py \
            -v --tb=short

      - name: Run topological_nav_simulator unit tests
        working-directory: topological_nav_simulator
        run: |
          python -m pytest test/ -v --tb=short || true
          # These tests require geometry_msgs (ROS 2); they are
          # fully exercised in the test_docker job below.

  # -------------------------------------------------------------------
  # Full ROS 2 build + colcon test
  # -------------------------------------------------------------------
  test_docker:
    name: ROS Testing ${{ matrix.ros_distribution }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ros_distribution:
          - humble
          - jazzy

        include:
          # Humble Hawksbill (May 2022 - May 2027)
          - docker_image: ros:humble-ros-base
            ros_distribution: humble
            ros_version: 2

          # Jazzy Jalisco (May 2024 - May 2029)
          - docker_image: ros:jazzy-ros-base
            ros_distribution: jazzy
            ros_version: 2

    container:
      image: ${{ matrix.docker_image }}
    steps:
      - name: Configure apt retries
        run: |
          printf '%s\n' \
            'Acquire::Retries "5";' \
            'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' \
            > /etc/apt/apt.conf.d/80-retries

      - name: setup ROS environment
        uses: ros-tooling/setup-ros@main
        with:
          required-ros-distributions: ${{ matrix.ros_distribution }}
      - name: build and test ROS 2
        if: ${{ matrix.ros_version == 2 }}
        uses: ros-tooling/action-ros-ci@v0.3
        with:
          target-ros2-distro: ${{ matrix.ros_distribution }}
