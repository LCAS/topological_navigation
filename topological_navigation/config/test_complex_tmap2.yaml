# =============================================================================
# Complex topological map for comprehensive navigation testing.
#
# Layout (top-down view):
#
#  TopicNode                                                  Isolated
#   (-5,0)                                                     (30,0)
#     |
#  Charging ──nav──► HN1 ──nav_poses──► HN2 ──nav_poses──► HN3 ──nav──► WP_E
#   (0,0)          (5,0)              (10,0)              (15,0)        (20,0)
#     ▲              │ ▲                │ ▲                │ ▲            │
#     │             nav nav            nav nav            nav nav        nav
#     │              ▼  │               ▼  │               ▼  │          │
#     │           RowA0 │            RowB0  │           RowC0  │          ▼
#     │           (5,-3)│           (10,-3) │          (15,-3) │      AlignDock
#     │              │  │               │   │              │   │      (20,-10)
#     │             row  │             row   │            row   │
#     │              │  │               │   │              │   │
#     │              ▼  │               ▼   │              ▼   │
#     │           RowA1 │            RowB1  │           RowC1  │
#     │           (5,-8)│           (10,-8) │          (15,-8) │
#     │              │  │               │   │              │   │
#     │             row  │             row   │            row   │
#     │              │  │               │   │              │   │
#     │              ▼  │               ▼   │              ▼   │
#     │           RowA2 │            RowB2  │           RowC2  │
#     │          (5,-13)│          (10,-13) │         (15,-13) │
#     │              │  │               │   │              │   │
#     │             row  │             row   │            row   │
#     │              │  │               │   │              │   │
#     │              ▼  │               ▼   │              ▼   │
#     │           RowA3 │            RowB3  │           RowC3  │
#     │          (5,-18)│          (10,-18) │         (15,-18) │
#     │              │                 │                   │          NoGo
#     │            align             align               align      (25,-10)
#     │              ▼                 ▼                   ▼
#     │            HS1 ──nav_poses──► HS2 ──nav_poses──► HS3 ──nav──► WP_SE
#     │           (5,-20)           (10,-20)           (15,-20)      (20,-20)
#     │              │                                                  │
#     └──────nav─────┘                                                  │
#                                          ◄────────────nav─────────────┘
#
# Edge types used:
#   navigate_to_pose  (non-composable) – headland links, junctions
#   navigate_to_poses (composable)     – headland traversals, multi-waypoint
#   row_traversal     (composable)     – crop row segments with boundaries
#   goal_align        (non-composable) – precision docking / row exit alignment
#
# Bidirectional edges: HN1↔HN2, HN2↔HN3, HS1↔HS2, HS2↔HS3,
#                      HN1↔RowA0, HN2↔RowB0, HN3↔RowC0,
#                      WP_E↔WP_SE, Charging↔HN1
# Unidirectional edges: row traversals (southward only),
#                       align exits (row end → headland south),
#                       HN3→WP_E, WP_E→AlignDock, HS1→Charging,
#                       WP_SE→Charging
#
# Special nodes:
#   Isolated     – disconnected (connectivity test)
#   NoGo         – no_go: true (restricted area)
#   TopicNode    – localise_by_topic (topic-based localisation)
#   AlignDock    – dead-end precision docking target
# =============================================================================

meta:
  last_updated: 09-03-2026_12-00-00
  origin:
    latitude: 53.268642038
    longitude: -0.524509505881
    altitude: 0

metric_map: complex_nav_test
name: complex_nav_test
pointset: complex_nav_test

transformation:
  topo_frame_id: complex_nav_test
  parent: map
  rotation:
    w: 1.0
    x: 0.0
    y: 0.0
    z: 0.0
  translation:
    x: 0.0
    y: 0.0
    z: 0.0

# ─────────────────────────────────────────────────────────────────────────────
# Definitions – behaviour trees referenced by actions
# ─────────────────────────────────────────────────────────────────────────────
definitions:
  default_bt: |
    <root main_tree_to_execute="MainTree">
      <BehaviorTree ID="MainTree">
        <PipelineSequence name="NavigateWithReplanning">
          <ComputePathToPose goal="{goal}" path="{path}" planner_id="GridBased"/>
          <FollowPath path="{path}" controller_id="FollowPath"/>
        </PipelineSequence>
      </BehaviorTree>
    </root>
  goal_align_bt: |
    <root main_tree_to_execute="MainTree">
      <BehaviorTree ID="MainTree">
        <PipelineSequence name="NavigateWithReplanning">
          <ComputePathToPose goal="{goal}" path="{path}" planner_id="GridBased"/>
          <FollowPath path="{path}" controller_id="FollowPath"/>
        </PipelineSequence>
      </BehaviorTree>
    </root>
  row_traversal_bt: |
    <root main_tree_to_execute="MainTree">
      <BehaviorTree ID="MainTree">
        <PipelineSequence name="NavigateWithReplanning">
          <ComputePathThroughPoses goals="{goals}" path="{path}" planner_id="GridBased"/>
          <FollowPath path="{path}" controller_id="FollowPath"/>
        </PipelineSequence>
      </BehaviorTree>
    </root>

# ─────────────────────────────────────────────────────────────────────────────
# Actions – all four action types
# ─────────────────────────────────────────────────────────────────────────────
actions:
  navigate_to_pose:
    composable: false
    action_type: nav2_msgs.action.NavigateToPose
    action_server: /navigate_to_pose
    action_goal_template:
      pose:
        header:
          frame_id: '${node.nav_frame}'
        pose: '${node.pose}'
      behavior_tree: '${definitions.default_bt}'

  navigate_to_poses:
    composable: true
    action_type: nav2_msgs.action.NavigateThroughPoses
    action_server: /navigate_through_poses
    action_goal_template:
      poses:
        - header:
            frame_id: '${node.nav_frame}'
          pose: '${node.pose}'
      behavior_tree: '${definitions.default_bt}'

  goal_align:
    composable: false
    action_type: nav2_msgs.action.NavigateToPose
    action_server: /navigate_to_pose
    action_goal_template:
      pose:
        header:
          frame_id: '${node.nav_frame}'
        pose: '${node.pose}'
      behavior_tree: '${definitions.goal_align_bt}'

  row_traversal:
    composable: true
    action_type: nav2_msgs.action.NavigateThroughPoses
    action_server: /navigate_through_poses
    action_goal_template:
      poses:
        - header:
            frame_id: '${node.nav_frame}'
          pose: '${node.pose}'
      behavior_tree: '${definitions.row_traversal_bt}'

