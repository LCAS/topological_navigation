$schema: http://json-schema.org/draft-07/schema#
title: Topological Map Schema
type: object
required:
  - meta
  - metric_map
  - name
  - nodes
  - pointset
additionalProperties: true
properties:
  meta:
    type: object
    properties:
      last_updated:
        type: string
    required:
      - last_updated
    additionalProperties: true
  metric_map:
    type: string
  name:
    type: string
  navigation_config_file:
    type: string
    description: >
      Optional path to a sidecar YAML file, conventionally named
      topological_navigation_config.yaml, containing the top-level definitions
      and actions sections.
  nodes:
    type: array
    items:
      type: object
      required:
        - meta
        - node
      properties:
        meta:
          type: object
          required:
            - map
            - node
            - pointset
          properties:
            map:
              type: string
            node:
              type: string
            pointset:
              type: string
        node:
          type: object
          required:
            - edges
            - name
            # - parent_frame
          additionalProperties: true
          properties:
            edges:
              type: array
              items:
                type: object
                additionalProperties: true
                required:
                  - edge_id
                  - node
                properties:
                  edge_id:
                    type: string
                  node:
                    type: string
                  properties:
                    type: object
                    additionalProperties: true
                    description: Flexible dictionary of application-specific edge properties (e.g., max_speed, priority, surface_type)
                    properties:
                      set_ros_params:
                        description: >-
                          ROS 2 parameters applied while this edge's segment executes and
                          restored afterwards. Overrides the action-level 'set_ros_params'
                          per node/parameter. Accepts {node: {param: value}},
                          {param: value} (goal-checker node), or a list of
                          {node, param, value} / {node, params} entries.
                        oneOf:
                          - type: object
                            additionalProperties: true
                          - type: array
                            items:
                              type: object
                              additionalProperties: true
            name:
              type: string
            parent_frame:
              type: string
            properties:
              type: object
              additionalProperties: true
              description: Flexible dictionary of application-specific node properties (e.g., xy_goal_tolerance, yaw_goal_tolerance, semantics, zone)
  pointset:
    type: string
