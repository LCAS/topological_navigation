  - meta:
      map: complex_test_map
      node: TopicLocaliseNode
      pointset: complex_test_map
    node:
      edges: []
      localise_by_topic: '{"topic": "/special_zone", "field": "data", "val": "active", "localise_anywhere": true, "persistency": 5}'
      name: TopicLocaliseNode
      nav_frame: '${transformation.topo_frame_id}'
      pose:
        orientation:
          w: 1.0
          x: 0.0
          y: 0.0
          z: 0.0
        position:
          x: 10.0
