meta:
  last_updated: 01-01-2026_00-00-00
  origin:
    latitude: 0.0
    longitude: 0.0
    altitude: 0.0

metric_map: complex_test_map
name: complex_test_map
pointset: complex_test_map

transformation:
  topo_frame_id: complex_test_map
  parent: map
  rotation:
    w: 1.0
    x: 0.0
    y: 0.0
    z: 0.0
  translation:
    x: 0.0
    y: 0.0
    z: 0.0

definitions:
  default_bt: |
    <root main_tree_to_execute="MainTree">
      <BehaviorTree ID="MainTree">
        <PipelineSequence name="NavigateWithReplanning">
          <ComputePathToPose goal="{goal}" path="{path}" planner_id="GridBased"/>
          <FollowPath path="{path}" controller_id="FollowPath"/>
        </PipelineSequence>
      </BehaviorTree>
    </root>
  row_traversal_bt: |
    <root main_tree_to_execute="MainTree">
      <BehaviorTree ID="MainTree">
        <PipelineSequence name="NavigateWithReplanning">
          <ComputePathThroughPoses goals="{goals}" path="{path}" planner_id="GridBased"/>
          <FollowPath path="{path}" controller_id="FollowPath"/>
        </PipelineSequence>
      </BehaviorTree>
    </root>

actions:
  navigate_to_pose:
    composable: false
    action_type: nav2_msgs.action.NavigateToPose
    action_server: /navigate_to_pose
    action_goal_template:
      pose:
        header:
          frame_id: '${node.nav_frame}'
        pose: '${node.pose}'
      behavior_tree: '${definitions.default_bt}'

  row_traversal:
    composable: true
    action_type: nav2_msgs.action.NavigateThroughPoses
    action_server: /navigate_through_poses
    action_goal_template:
      poses:
        - header:
            frame_id: '${node.nav_frame}'
          pose: '${node.pose}'
      behavior_tree: '${definitions.row_traversal_bt}'

nodes:
  - meta:
      map: complex_test_map
      node: Entry
      pointset: complex_test_map
      tag: ['entry_point']
    node:
      edges:
        - action: navigate_to_pose
          edge_id: Entry_Junction1
          node: Junction1
          properties:
            max_speed: 0.8
        - action: navigate_to_pose
          edge_id: Entry_Row1Start
          node: Row1Start
      name: Entry
      nav_frame: '${transformation.topo_frame_id}'
      pose:
        orientation:
          w: 1.0
          x: 0.0
          y: 0.0
          z: 0.0
        position:
          x: 0.0
          y: 0.0
          z: 0.0
      properties:
        xy_goal_tolerance: 0.3
        yaw_goal_tolerance: 0.1
        semantics: entry
      verts:
        - x: -1.0
          y: -1.0
        - x: 1.0
          y: -1.0
        - x: 1.0
          y: 1.0
        - x: -1.0
          y: 1.0

  - meta:
      map: complex_test_map
      node: Junction1
      pointset: complex_test_map
    node:
      edges:
        - action: navigate_to_pose
          edge_id: Junction1_Row1Start
          node: Row1Start
        - action: navigate_to_pose
          edge_id: Junction1_Row2Start
          node: Row2Start
        - action: navigate_to_pose
          edge_id: Junction1_Exit
          node: Exit
      name: Junction1
      nav_frame: '${transformation.topo_frame_id}'
      pose:
        orientation:
          w: 1.0
          x: 0.0
          y: 0.0
          z: 0.0
        position:
          x: 5.0
          y: 0.0
          z: 0.0
      properties:
        xy_goal_tolerance: 0.5
      verts:
        - x: -1.5
          y: -1.5
        - x: 1.5
          y: -1.5
        - x: 1.5
          y: 1.5
        - x: -1.5
          y: 1.5

  - meta:
      map: complex_test_map
      node: Row1Start
      pointset: complex_test_map
      tag: ['row_entry']
    node:
      edges:
        - action: row_traversal
          edge_id: Row1Start_Row1End
          node: Row1End
          properties:
            max_speed: 0.3
            row_type: vineyard
            roboflow:
              enabled: true
              confidence: 0.7
      name: Row1Start
      nav_frame: '${transformation.topo_frame_id}'
      pose:
        orientation:
          w: 0.707
          x: 0.0
          y: 0.0
          z: 0.707
        position:
          x: 5.0
          y: 5.0
          z: 0.0
      properties:
        xy_goal_tolerance: 0.2
        yaw_goal_tolerance: 0.05
        semantics: row_entry
      verts:
        - x: -0.5
          y: -0.5
        - x: 0.5
          y: -0.5
        - x: 0.5
          y: 0.5
        - x: -0.5
          y: 0.5

  - meta:
      map: complex_test_map
      node: Row1End
      pointset: complex_test_map
      tag: ['row_exit']
    node:
      edges:
        - action: navigate_to_pose
          edge_id: Row1End_Junction2
          node: Junction2
      name: Row1End
      nav_frame: '${transformation.topo_frame_id}'
      pose:
        orientation:
          w: 0.707
          x: 0.0
          y: 0.0
          z: 0.707
        position:
          x: 15.0
          y: 5.0
          z: 0.0
      properties:
        xy_goal_tolerance: 0.2
        semantics: row_exit
      verts:
        - x: -0.5
          y: -0.5
        - x: 0.5
          y: -0.5
        - x: 0.5
          y: 0.5
        - x: -0.5
          y: 0.5

  - meta:
      map: complex_test_map
      node: Row2Start
      pointset: complex_test_map
      tag: ['row_entry']
    node:
      edges:
        - action: row_traversal
          edge_id: Row2Start_Row2End
          node: Row2End
          properties:
            max_speed: 0.3
            row_type: vineyard
      name: Row2Start
      nav_frame: '${transformation.topo_frame_id}'
      pose:
        orientation:
          w: 0.707
          x: 0.0
          y: 0.0
          z: 0.707
        position:
          x: 5.0
          y: -5.0
          z: 0.0
      properties:
        xy_goal_tolerance: 0.2
        yaw_goal_tolerance: 0.05
        semantics: row_entry
      verts:
        - x: -0.5
          y: -0.5
        - x: 0.5
          y: -0.5
        - x: 0.5
          y: 0.5
        - x: -0.5
          y: 0.5

  - meta:
      map: complex_test_map
      node: Row2End
      pointset: complex_test_map
      tag: ['row_exit']
    node:
      edges:
        - action: navigate_to_pose
          edge_id: Row2End_Junction2
          node: Junction2
      name: Row2End
      nav_frame: '${transformation.topo_frame_id}'
      pose:
        orientation:
          w: 0.707
          x: 0.0
          y: 0.0
          z: 0.707
        position:
          x: 15.0
          y: -5.0
          z: 0.0
      properties:
        xy_goal_tolerance: 0.2
        semantics: row_exit
      verts:
        - x: -0.5
