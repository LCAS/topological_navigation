      pointset: complex_test_map
      tag: ['no_go']
    node:
      edges: []
      name: NoGoZone
      nav_frame: '${transformation.topo_frame_id}'
      pose:
        orientation:
          w: 1.0
          x: 0.0
          y: 0.0
          z: 0.0
        position:
          x: 10.0
          y: 10.0
          z: 0.0
      properties:
        xy_goal_tolerance: 0.3
