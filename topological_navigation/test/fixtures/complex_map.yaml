        - x: 0.5
          y: -0.5
        - x: 0.5
          y: 0.5
        - x: -0.5
          y: 0.5

  - meta:
      map: complex_test_map
      node: Junction2
      pointset: complex_test_map
    node:
      edges:
        - action: navigate_to_pose
          edge_id: Junction2_Exit
          node: Exit
      name: Junction2
      nav_frame: '${transformation.topo_frame_id}'
      pose:
        orientation:
          w: 1.0
          x: 0.0
          y: 0.0
          z: 0.0
        position:
          x: 20.0
          y: 0.0
          z: 0.0
      properties:
        xy_goal_tolerance: 0.5
      verts:
        - x: -1.5
          y: -1.5
        - x: 1.5
          y: -1.5
        - x: 1.5
