meta:
  last_updated: 08-03-2026_12-00-00
  origin:
    latitude: 53.268642038
    longitude: -0.524509505881
    altitude: 0

metric_map: mixed_test_map
name: mixed_test_map
pointset: mixed_test_map

# All nodes default to topo_frame_id ("mixed_test_map")
transformation:
  topo_frame_id: mixed_test_map
  parent: map
  rotation:
    w: 1.0
    x: 0.0
    y: 0.0
    z: 0.0
  translation:
    x: 0.0
    y: 0.0
    z: 0.0

definitions:
  default_bt: |
    <root main_tree_to_execute="MainTree">
      <BehaviorTree ID="MainTree">
        <PipelineSequence name="NavigateWithReplanning">
          <ComputePathToPose goal="{goal}" path="{path}" planner_id="GridBased"/>
          <FollowPath path="{path}" controller_id="FollowPath"/>
        </PipelineSequence>
      </BehaviorTree>
    </root>
  goal_align_bt: |
    <root main_tree_to_execute="MainTree">
      <BehaviorTree ID="MainTree">
        <PipelineSequence name="NavigateWithReplanning">
          <ComputePathToPose goal="{goal}" path="{path}" planner_id="GridBased"/>
          <FollowPath path="{path}" controller_id="FollowPath"/>
        </PipelineSequence>
      </BehaviorTree>
    </root>
  row_traversal_bt: |
    <root main_tree_to_execute="MainTree">
      <BehaviorTree ID="MainTree">
        <PipelineSequence name="NavigateWithReplanning">
          <ComputePathThroughPoses goals="{goals}" path="{path}" planner_id="GridBased"/>
          <FollowPath path="{path}" controller_id="FollowPath"/>
        </PipelineSequence>
      </BehaviorTree>
    </root>

actions:
  navigate_to_pose:
    composable: false
    action_type: nav2_msgs.action.NavigateToPose
    action_server: /navigate_to_pose
    action_goal_template:
      pose:
        header:
          frame_id: '${node.nav_frame}'
        pose: '${node.pose}'
      behavior_tree: '${definitions.default_bt}'

  navigate_to_poses:
    composable: true
    action_type: nav2_msgs.action.NavigateThroughPoses
    action_server: /navigate_through_poses
    action_goal_template:
      poses:
        - header:
            frame_id: '${node.nav_frame}'
          pose: '${node.pose}'
      behavior_tree: '${definitions.default_bt}'

  goal_align:
    composable: false
    action_type: nav2_msgs.action.NavigateToPose
    action_server: /navigate_to_pose
    action_goal_template:
      pose:
        header:
          frame_id: '${node.nav_frame}'
        pose: '${node.pose}'
      behavior_tree: '${definitions.goal_align_bt}'

  row_traversal:
    composable: true
    action_type: nav2_msgs.action.NavigateThroughPoses
    action_server: /navigate_through_poses
    action_goal_template:
      poses:
        - header:
            frame_id: '${node.nav_frame}'
          pose: '${node.pose}'
      behavior_tree: '${definitions.row_traversal_bt}'

