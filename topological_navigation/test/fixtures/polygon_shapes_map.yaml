      name: PentagonNode
      nav_frame: '${transformation.topo_frame_id}'
      pose:
        orientation:
          w: 1.0
          x: 0.0
          y: 0.0
          z: 0.0
        position:
          x: 10.0
          y: 0.0
          z: 0.0
      properties:
        xy_goal_tolerance: 0.3
      verts:
        - x: 0.0
          y: 2.0
        - x: 1.902
          y: 0.618
        - x: 1.176
          y: -1.618
        - x: -1.176
          y: -1.618
        - x: -1.902
          y: 0.618

