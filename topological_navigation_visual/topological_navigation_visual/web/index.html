<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Topological Navigation</title>
  <script>
    // All URLs in this app are relative so it can be served under any URL
    // prefix behind a reverse proxy.  Ensure the page URL ends with "/" so
    // relative paths resolve below the prefix (e.g. /robot1/topo -> /robot1/topo/).
    (function () {
      var p = window.location.pathname;
      if (p.charAt(p.length - 1) !== '/' && p.slice(-5) !== '.html') {
        window.location.replace(p + '/' + window.location.search + window.location.hash);
      }
    }());
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="root"></div>
  <noscript>This web app requires JavaScript.</noscript>
  <!-- All libraries are bundled locally so the app works offline. -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/htm.umd.js"></script>
  <script src="vendor/cytoscape.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
